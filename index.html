<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saluvé · Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#E6EAE9;--card:#fff;--ink:#16302D;--mut:#5E706D;--pri:#12403A;--acc:#62E5CF;--line:#D5DDDB;--warn:#B4561B;--ok:#157A5E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1D1B;--card:#16302D;--ink:#E6F2EF;--mut:#97B0AB;--pri:#62E5CF;--line:#244743;--warn:#F0A36B;--ok:#62E5CF}}
:root[data-theme="dark"]{--bg:#0E1D1B;--card:#16302D;--ink:#E6F2EF;--mut:#97B0AB;--pri:#62E5CF;--line:#244743;--warn:#F0A36B;--ok:#62E5CF}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.5 Montserrat,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--pri)}
.lcard{background:var(--card);border-radius:20px;padding:32px 28px;width:100%;max-width:380px;text-align:center}
.lcard img{width:150px;height:150px;border-radius:50%}
.lcard h1{font-size:20px;margin:12px 0 4px}.lcard p{color:var(--mut);margin:0 0 18px}
label{display:block;text-align:left;font-weight:600;font-size:12px;margin:10px 0 4px}
input,textarea,select{font:inherit;color:inherit;width:100%;background:var(--card);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0E1D1B}}
.btn.s{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.m{padding:6px 10px;font-size:12px}
.btn.w{width:100%;margin-top:16px}
.err{color:var(--warn);font-weight:600;margin-top:10px;min-height:20px}
header{background:var(--pri);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header img{width:56px;height:56px;border-radius:50%;border:2px solid #62E5CF;background:#12403A}
header b{font-weight:800;font-size:18px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#cfe;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600}
nav button.on{background:var(--acc);color:#12403A}
nav button:disabled{opacity:.45;cursor:default}
.who{font-size:12px;display:flex;align-items:center;gap:10px}
.who .btn{background:rgba(255,255,255,.15)}
main{max-width:1100px;margin:0 auto;padding:20px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h2{margin:0;font-size:22px;flex:1;min-width:160px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:12px 16px;border-left:5px solid var(--acc)}
.stat b{display:block;font-size:24px;font-weight:800}.stat span{color:var(--mut);font-size:12px}
.tw{background:var(--card);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;color:var(--mut);padding:10px 12px;border-bottom:1.5px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.th{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--bg);display:block}
.ph{width:46px;height:46px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--mut);font-weight:800}
.code{font-weight:700;color:var(--pri);white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg)}
.tag.low{background:#F7DCC9;color:#8A3E0C}.tag.ok{background:#CFF5EC;color:#0D5A46}
.det{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:6px 0}
.det img,.det .big{width:120px;height:120px;border-radius:14px;object-fit:cover;background:var(--bg)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:13px}.kv dt{color:var(--mut);font-weight:600}.kv dd{margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mask{position:fixed;inset:0;background:rgba(10,25,22,.6);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.modal{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:18px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;font-weight:600}
.empty{padding:30px;text-align:center;color:var(--mut)}
@media(max-width:560px){.det,.row2{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(10px);opacity:0}}}

.pager{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.pgb{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer;min-width:38px}
.pgb.on{background:var(--pri);color:var(--card);border-color:var(--pri)}.pgb:disabled{opacity:.4;cursor:default}
.pgi{text-align:center;color:var(--mut);font-size:12px}.pgd{align-self:center;color:var(--mut)}
@media(max-width:700px){
header{padding:10px 12px;gap:8px 10px}header img{width:64px;height:64px}header b{font-size:22px;flex:1}
.who{flex-basis:100%;justify-content:space-between;order:2}
nav{order:3;flex:1 1 100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{padding:10px 2px;font-size:13px;text-align:center}
main{padding:14px 12px}
.top h2{flex:1 1 100%}.top #q{max-width:none!important;flex:1 1 100%}.top .btn{flex:1}
.tw{background:transparent;overflow:visible}
table.rt{min-width:0!important}
table.rt thead{display:none}
table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
table.rt tr{background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:10px}
table.rt td{border:0;padding:4px 0;display:flex;gap:10px;justify-content:space-between;align-items:center;text-align:right}
table.rt td::before{content:attr(data-l);color:var(--mut);font-weight:600;font-size:12px;text-align:left;flex:0 0 36%}
table.rt td[data-l=""]::before{display:none}
table.rt td:first-child{justify-content:flex-start}
table.rt td.empty{justify-content:center}
.acts{justify-content:flex-end}
}
</style></head><body>

<label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required>
<div class="err" id="le"></div><button class="btn w" type="submit">Ingresar</button></form></section>

<section id="app" class="hidden">
<header><img class="lg" alt=""><b>Saluvé</b>

<div class="who"><span id="wn"></span><button class="btn m" id="out">Salir</button></div></header>
<main id="main"></main></section>

const PS=20,PG={prod:1,inv:1,ven:1},PGN={};
function pg(k,A){PGN[k]=A.length;const n=Math.max(1,Math.ceil(A.length/PS));if(PG[k]>n)PG[k]=n;return A.slice((PG[k]-1)*PS,PG[k]*PS)}
function goP(k,fn,n){PG[k]=n;window[fn]();window.scrollTo({top:0,behavior:'smooth'})}
function pager(k,fn){const N=PGN[k]||0,n=Math.ceil(N/PS);if(n<2)return N?`<div class="pgi">${N} resultado${N>1?'s':''}</div>`:'';const c=PG[k];let h='',l=0;
[...new Set([1,n,c-1,c,c+1])].filter(x=>x>=1&&x<=n).sort((a,b)=>a-b).forEach(x=>{if(l&&x-l>1)h+='<span class="pgd">…</span>';h+=`<button class="pgb${x===c?' on':''}" onclick="goP('${k}','${fn}',${x})">${x}</button>`;l=x});
return `<div class="pager"><button class="pgb" ${c<2?'disabled':''} onclick="goP('${k}','${fn}',${c-1})">‹ Anterior</button>${h}<button class="pgb" ${c>=n?'disabled':''} onclick="goP('${k}','${fn}',${c+1})">Siguiente ›</button></div><div class="pgi">Mostrando ${(c-1)*PS+1}–${Math.min(c*PS,N)} de ${N}</div>`}
function cards(){document.querySelectorAll('.tw table').forEach(t=>{t.classList.add('rt');const h=[...t.querySelectorAll('th')].map(x=>x.textContent);t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((c,i)=>c.dataset.l=c.colSpan>1?'':(h[i]||'')))})}
new MutationObserver(cards).observe($('#main'),{childList:true,subtree:true});
(async()=>{const{data}=await sb.auth.getSession(),em=data.session&&data.session.user.email;ME=Object.keys(CFG.emails).find(k=>CFG.emails[k]===em)||null;if(ME)await boot()})();
</script></body></html>
